<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Bombshell Boss Babes</title>
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="version.js?v=1.0.0"></script>
  <link rel="stylesheet" href="css/styles.css?v=1.0.0" />
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Boss Babe Collection</p>
      <h1>Shop Merchandise</h1>
      <p>Printed on demand · Shipped directly to you</p>
    </div>
  </section>

  <section class="section" id="cart">
    <div class="container">
      <div class="shop-bar">
        <button class="filter-btn is-active" type="button" data-filter="all">All</button>
        <button class="filter-btn" type="button" data-filter="apparel">Apparel</button>
        <button class="filter-btn" type="button" data-filter="lifestyle">Lifestyle</button>
        <button class="filter-btn" type="button" data-filter="office">For the Office</button>
      </div>
      <div class="product-grid" id="productGrid"></div>
      <p style="text-align:center;margin-top:2rem">
        <button class="btn btn--primary snipcart-checkout" type="button">View Cart & Checkout</button>
      </p>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/config.js?v=1.0.0"></script>
  <script src="js/products.js?v=1.0.0"></script>
  <script src="js/layout.js?v=1.0.0"></script>
  <script src="js/main.js?v=1.0.0"></script>
  <script src="js/shop.js?v=1.0.0"></script>
</body>
</html>
